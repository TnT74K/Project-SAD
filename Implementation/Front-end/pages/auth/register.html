<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام در رزرو سنتر</title>
    <link rel="stylesheet" href="../Css/register.css">
</head>
<body>
    <div class="auth-card">
        <div class="logo-block">
            <div class="logo-text">رزرو سنتر</div>
            <div class="logo-sub">ایجاد حساب کاربری جدید</div>
        </div>

            <div class="form-group">
                <label for="username">نام کاربری
                    <span class="required-star">*</span>
                </label>
                <div class="input-group">
                    <input type="text" id="username" name="username" required placeholder="نام کاربری خود را وارد کنید">
                    <div class="error-message" id="username-error"></div>
                </div>
            </div>

             <div class="form-group">
                <label for="phone-number">شماره تلفن
                    <span class="required-star">*</span>
                </label>
                <div class="input-group">
                    <input type="text" id="phone-number" name="phone-number" inputmode="numeric" maxlength="11" required placeholder="شماره تلفن را مانند 09131234567 وارد کنید">
                    <div class="error-message" id="phone-number-error"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="password">رمز عبور
                    <span class="required-star">*</span>
                </label>
                <div class="input-group">
                    <input type="password" id="password" name="password" required placeholder="رمز عبور خود را وارد کنید" class="has-icon">
                    <span class="toggle-icon" onclick="togglePasswordVisibility('password', this)">👁</span>
                    <div class="error-message" id="password-error"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">تکرار رمز عبور
                    <span class="required-star">*</span>
                </label>
                <div class="input-group">
                    <input type="password" id="confirm-password" name="confirm-password" required placeholder="رمز عبور را دوباره وارد کنید" class="has-icon">
                    <span class="toggle-icon" onclick="togglePasswordVisibility('confirm-password', this)">👁</span>
                    <div class="error-message" id="confirm-error"></div>
                </div>
            </div>

            <button type="submit" class="btn-primary">ثبت‌نام</button>
        </form>

        <div class="login-link">
            قبلاً حساب کاربری ساخته‌اید؟ <a href="login.html">وارد شوید</a>
        </div>
    </div>
    <script src="../JavaScript/register.js"></script>

</body>

</html>
