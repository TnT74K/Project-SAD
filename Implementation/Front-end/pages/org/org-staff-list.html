<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<!-- تنظیم encoding و ریسپانسیو -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مدیریت کارمندان</title>

<!-- اتصال فونت Vazirmatn -->


<!-- اتصال فایل CSS -->
<link rel="stylesheet" href="../Css/OrganizationAdminWorkerList.css">

</head>

<body>

<div id="header-placeholder"></div>

<main>

<div class="container">

<div class="card">

<div class="page-title">مدیریت کارمندان</div>

<!-- تولبار شامل جستجو و دکمه ثبت -->
<div class="toolbar">

<!-- بخش جستجو -->
<div class="search-box">

<!-- ورودی جستجو -->
<input id="searchInput" placeholder="جستجو...">

<!-- دکمه جستجو -->
<button class="btn-primary" onclick="searchUser()">جستجو</button>

<!-- دکمه نمایش همه کاربران -->
<button class="btn-warning" onclick="showAllUsers()">نمایش همه</button>

</div>

<!-- دکمه ثبت کارمند -->
<button class="btn-primary" onclick="openModal()">ثبت کارمند</button>

</div>

<!-- جدول نمایش کاربران -->
<table>

<thead>
<tr>
<th>نام</th>
<th>نام خانوادگی</th>
<th>شماره موبايل</th>
<th>نقش</th>
<th>وضعیت</th>
<th>عملیات</th>
</tr>
</thead>

<!-- بدنه جدول که توسط JS پر می‌شود -->
<tbody id="userTable"></tbody>

</table>

</div>

</div>


<!-- مودال ثبت / ویرایش کارمند -->
<div class="modal" id="userModal">

<div class="modal-content">

<!-- عنوان مودال -->
<div class="modal-header">ثبت / ویرایش کارمند</div>

<!-- فرم اطلاعات کارمند -->
<div class="form-grid">

<input id="firstName" placeholder="نام">
<input id="lastName" placeholder="نام خانوادگی">
<input id="phoneNumber" placeholder="شماره موبايل">
<input id="nationalCode" placeholder="کد ملی">
<input id="username" placeholder="نام کاربری">

<!-- فیلد رمز با دکمه نمایش -->
<div class="password-wrap">
<input id="password" type="password" placeholder="رمز عبور">
<button class="show-pass" onclick="togglePass()">👁</button>
</div>

<!-- انتخاب نقش -->
<select id="role">
<option>پشتيبان سازمان</option>
<option>كارمند حضوري</option>
</select>

</div>

<!-- دکمه‌های پایین مودال -->
<div class="modal-actions">

<button class="btn-primary" onclick="saveUser()">ثبت</button>
<button onclick="closeModal()">انصراف</button>

</div>

</div>
</div>

<div class="modal" id="confirmModal">
  <div class="modal-content">
    <h3 id="confirmTitle">تأیید عملیات</h3>
    <p id="confirmText"></p>

    <div class="modal-actions">
      <button id="confirmBtn" onclick="confirmAction()">تأیید</button>
      <button onclick="closeConfirmModal()">انصراف</button>
    </div>
  </div>
</div>

</div>
</div>

</main>

<div id="footer-placeholder"></div>


<!-- اتصال فایل جاوااسکریپت -->
<script src="../JavaScript/OrganizationAdminWorkerList.js"></script>
<script src="../JavaScript/LoadHeader.js"></script>
<script src="../JavaScript/Header.js"></script>
<script src="../JavaScript/LoadFooter.js"></script>

</body>
</html>
