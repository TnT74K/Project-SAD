<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازیابی رمز عبور</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Inline CSS for demonstration - in a real project, use style.css */
        :root {
            --primary: #0B2545;
            --primary-mid: #1B4F72;
            --primary-light: #2E86C1;
            --accent: #D4AC0D;
            --bg: #eef2f7;
            --bg-card: #ffffff;
            --text: #1a2a3a;
            --text-2: #4a6080;
            --text-3: #8aa0b8;
            --border: rgba(11,37,69,.1);
            --radius: 14px;
            --radius-sm: 8px;
            --shadow: 0 2px 16px rgba(11,37,69,.08);
            --shadow-md: 0 4px 24px rgba(11,37,69,.13);
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(ellipse at 20% 0%, rgba(46,134,193,0.12) 0%, transparent 55%),
                        radial-gradient(ellipse at 80% 100%, rgba(11,37,69,0.10) 0%, transparent 50%),
                        linear-gradient(160deg, #dde8f4 0%, #eef2f7 40%, #e8f0f8 100%);
            background-attachment: fixed;
            color: var(--text);
        }

        .auth-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px;
            width: 380px;
            max-width: 90%;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .auth-card h1 {
            color: var(--primary);
            margin-bottom: 24px;
            font-size: 1.8rem;
        }

        .auth-card .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .auth-card .logo-sub {
            font-size: 0.9rem;
            color: var(--text-2);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-2);
            font-weight: 600;
        }

        .input-group {
            position: relative;
            display: flex; /* Needed for aligning input and icon */
            align-items: center;
        }

        .input-group input {
            flex-grow: 1; /* Input takes available space */
            padding: 12px var(--radius-sm);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background-color: var(--bg-card);
            color: var(--text);
            font-family: 'Vazirmatn', sans-serif;
            box-sizing: border-box;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(46, 134, 193, 0.2);
        }

        .toggle-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
            font-size: 18px;
            color: var(--text-3);
            z-index: 10; /* Ensure icon is above input */
        }

        .input-group input.has-icon {
            padding-left: 42px; /* Space for the icon */
        }

        .btn-primary {
            background: var(--primary-light);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: var(--primary-mid);
        }

        .back-to-login {
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--text-2);
        }

        .back-to-login a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
        }
        .back-to-login a:hover {
            color: var(--primary-mid);
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo-block">
            <div class="logo-text">رزرو سنتر</div>
            <div class="logo-sub">بازیابی رمز عبور</div>
        </div>

        <form>
            <div class="form-group">
                <label for="national_id">کد ملی</label>
                <div class="input-group">
                    <input type="password" id="national_id" name="national_id" required placeholder="کد ملی خود را وارد کنید" class="has-icon">
                </div>
            </div>

            <div class="form-group">
                <label for="new_password">رمز عبور جدید</label>
                <div class="input-group">
                    <input type="password" id="new_password" name="new_password" required placeholder="رمز عبور جدید را وارد کنید" class="has-icon">
                    <span class="toggle-icon" onclick="togglePasswordVisibility('new_password', this)">👁️‍🗨️</span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_new_password">تکرار رمز عبور جدید</label>
                <div class="input-group">
                    <input type="password" id="confirm_new_password" name="confirm_new_password" required placeholder="رمز عبور جدید را دوباره وارد کنید" class="has-icon">
                    <span class="toggle-icon" onclick="togglePasswordVisibility('confirm_new_password', this)">👁️‍🗨️</span>
                </div>
            </div>

            <button type="submit" class="btn-primary">بازیابی رمز عبور</button>
        </form>

        <div class="back-to-login">
            به صفحه ورود بازگردید؟ <a href="login.html">ورود</a>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '👁️‍🗨️'; // Eye with a line through it
            } else {
                input.type = 'password';
                icon.textContent = '👁'; // Regular eye
            }
        }
    </script>
</body>
</html>
