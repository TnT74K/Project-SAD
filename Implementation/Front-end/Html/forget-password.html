<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازیابی رمز عبور</title>
    <link rel="stylesheet" href="../Css/forget-password.css">
</head>
<body>
    <div class="auth-card">
        <div class="logo-block">
            <div class="logo-text">رزرو سنتر</div>
            <div class="logo-sub">بازیابی رمز عبور</div>
        </div>

        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="username">نام کاربری</label>
                <div class="input-group">
                    <input type="text" id="username" name="username" required placeholder="نام کاربری خود را وارد کنید">
                </div>
            </div>

            <div class="form-group">
                <label for="national_id">کد ملی</label>
                <div class="input-group">
                    <input type="text" id="national_id" name="national_id" inputmode="numeric" maxlength="10" required placeholder="کد ملی خود را وارد کنید">
                </div>
            </div>

            <div class="form-group">
                <label for="new_password">رمز عبور جدید</label>
                <div class="input-group">
                    <input type="password" id="new_password" name="new_password" required placeholder="رمز عبور جدید را وارد کنید" class="has-icon">
                    <span class="toggle-icon" onclick="togglePasswordVisibility('new_password', this)">👁</span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_new_password">تکرار رمز عبور جدید</label>
                <div class="input-group">
                    <input type="password" id="confirm_new_password" name="confirm_new_password" required placeholder="رمز عبور جدید را دوباره وارد کنید" class="has-icon">
                    <span class="toggle-icon" onclick="togglePasswordVisibility('confirm_new_password', this)">👁</span>
                </div>
            </div>

            <button type="submit" class="btn-primary">بازیابی رمز عبور</button>
        </form>

        <div class="back-to-login">
            به صفحه ورود بازگردید؟ <a href="login.html">ورود</a>
        </div>
    </div>
    <script src="../JavaScript/forget-password.js"></script>
</body>
</html>
