<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تأیید کسب‌وکارها</title>

  <!-- فونت فارسی وزیرمتن از گوگل فونتز -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">

  <!-- استایل‌های اصلی صفحه -->
  <link rel="stylesheet" href="./BusinessApproval.css" />
</head>
<body>

<!-- ── بدنه اصلی صفحه ── -->
<div class="container">
  <div class="card">

    <!-- عنوان صفحه -->
    <div class="page-title">تأیید کسب‌وکارهای جدید</div>

    <!-- نوار ابزار: جستجو و فیلتر -->
    <div class="toolbar">
      <div class="search-box">
        <!-- فیلد جستجوی آزاد بر اساس نام، مالک یا شهر -->
        <input id="searchInput" placeholder="جستجو بر اساس نام یا مالک..." style="min-width:220px;">

        <!-- فیلتر دسته‌بندی -->
        <select id="catFilter" onchange="applyFilters()">
          <option value="">همه دسته‌بندی‌ها</option>
          <option value="آرایشگاه">آرایشگاه</option>
          <option value="کلینیک">کلینیک</option>
          <option value="باشگاه">باشگاه</option>
          <option value="دندانپزشکی">دندانپزشکی</option>
          <option value="سالن زیبایی">سالن زیبایی</option>
        </select>

        <button class="btn-primary" onclick="applyFilters()">جستجو</button>
        <button class="btn-warning" onclick="showAll()">نمایش همه</button>
      </div>
    </div>

    <!-- نوار آمار: تعداد کل، در انتظار و ثبت‌شده امروز -->
    <div class="stats-bar" id="statsBar"></div>

    <!-- جدول نمایش کسب‌وکارها -->
    <table>
      <thead>
        <tr>
          <th>نام کسب‌وکار</th>
          <th>دسته‌بندی</th>
          <th>مالک</th>
          <th>شهر</th>
          <th>تاریخ ثبت</th>
          <th>عملیات</th>
        </tr>
      </thead>
      <!-- ردیف‌های جدول توسط جاوااسکریپت پر می‌شوند -->
      <tbody id="businessTable"></tbody>
    </table>

  </div>
</div>


<!-- ══════════════════════════════════════════
     مدال جزئیات کسب‌وکار
     با کلیک روی "جزئیات" باز می‌شه
══════════════════════════════════════════ -->
<div class="modal" id="detailModal">
  <div class="detail-content">

    <!-- هدر مدال: تصویر کاور و عنوان -->
    <div class="detail-header">
      <div class="detail-cover" id="detailCover">
        <!-- بج وضعیت -->
        <span class="detail-cover-badge">در انتظار تأیید</span>
        <!-- دکمه بستن -->
        <button class="detail-cover-close" onclick="closeDetail()">✕</button>
      </div>
      <div class="detail-title-row">
        <div class="detail-biz-name" id="detailName"></div>
        <div class="detail-biz-cat"  id="detailCat"></div>
      </div>
    </div>

    <!-- بدنه مدال: اطلاعات کامل کسب‌وکار -->
    <div class="detail-body">
      <div class="detail-grid" id="detailGrid"></div>
    </div>

    <!-- فوتر مدال: دکمه‌های تأیید، رد و بستن -->
    <div class="detail-footer">
      <button class="df-close"   onclick="closeDetail()">بستن</button>
      <button class="df-reject"  id="dfReject">✕ رد کردن</button>
      <button class="df-approve" id="dfApprove">✓ تأیید کردن</button>
    </div>

  </div>
</div>


<!-- ══════════════════════════════════════════
     مدال تأیید عملیات
     قبل از هر تأیید یا رد، یه بار از کاربر
     مطمئن می‌شیم که واقعاً می‌خواد این کار رو بکنه
══════════════════════════════════════════ -->
<div class="modal" id="confirmModal">
  <div class="confirm-content">
    <div class="confirm-title" id="confirmTitle">تأیید عملیات</div>
    <div class="confirm-text"  id="confirmText"></div>
    <div class="confirm-actions">
      <button class="ca-cancel" onclick="closeConfirm()">انصراف</button>
      <button id="confirmOkBtn" onclick="doAction()">تأیید</button>
    </div>
  </div>
</div>


<!-- فایل جاوااسکریپت اصلی -->
<script src="./BusinessApproval.js" defer></script>

</body>
</html>
