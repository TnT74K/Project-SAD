<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به رزرو سنتر</title>
    <link rel="stylesheet" href="/Implementation/Front-end/Css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-card">
        <div class="logo-block">
            <div class="logo-text">رزرو سنتر</div>
            <div class="logo-sub">ورود به حساب کاربری</div>
        </div>

        <form>
            <div class="form-group">
                <label for="username">نام کاربری</label>
                <div class="input-group">
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        placeholder="نام کاربری خود را وارد کنید"
                    >
                </div>
            </div>


            <div class="form-group">
                <label for="password">رمز عبور</label>
                <div class="input-group">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="رمز عبور خود را وارد کنید"
                        class="has-icon"
                    >
                    <span class="toggle-icon" onclick="togglePasswordVisibility('password', this)">👁</span>
                </div>
            </div>

            <a href="forget-password.html" class="forgot-password">فراموشی رمز عبور؟</a>

            <button type="submit" class="btn-primary">ورود</button>
        </form>

        <div class="signup-link">
            حساب کاربری ندارید؟ <a href="register.html">ثبت‌نام کنید</a>
        </div>
    </div>
    <script src="/Implementation/Front-end/JavaScript/login.js"></script>
</body>
</html>
