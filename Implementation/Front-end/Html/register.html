<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام در رزرو سنتر</title>
    <link rel="stylesheet" href="/Implementation/Front-end/Css/register.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-card">
        <div class="logo-block">
            <div class="logo-text">رزرو سنتر</div>
            <div class="logo-sub">ایجاد حساب کاربری جدید</div>
        </div>

        <form>
            <div class="form-group">
                <label for="name">نام و نام خانوادگی</label>
                <div class="input-group">
                    <input type="text" id="name" name="name" required placeholder="نام و نام خانوادگی خود را وارد کنید">
                </div>
            </div>

            <div class="form-group">
                <label for="username">نام کاربری</label>
                <div class="input-group">
                    <input type="text" id="username" name="username" required placeholder="نام کاربری خود را وارد کنید">
                </div>
            </div>

            <div class="form-group">
                <label for="national_id">کد ملی</label>
                <div class="input-group">
                    <input type="text" id="national_id" name="national_id" inputmode="numeric" maxlength="10" required placeholder="کد ملی ۱۰ رقمی خود را وارد کنید">
                </div>
            </div>

            <div class="form-group">
                <label for="password">رمز عبور</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" required placeholder="رمز عبور خود را وارد کنید" class="has-icon">
                    <span class="toggle-icon" onclick="togglePasswordVisibility('password', this)">👁</span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">تکرار رمز عبور</label>
                <div class="input-group">
                    <input type="password" id="confirm-password" name="confirm-password" required placeholder="رمز عبور را دوباره وارد کنید" class="has-icon">
                    <span class="toggle-icon" onclick="togglePasswordVisibility('confirm-password', this)">👁</span>
                </div>
            </div>

            <button type="submit" class="btn-primary">ثبت‌نام</button>
        </form>

        <div class="login-link">
            قبلاً حساب کاربری ساخته‌اید؟ <a href="login.html">وارد شوید</a>
        </div>
    </div>
    <script src="/Implementation/Front-end/JavaScript/register.js"></script>
</body>
</html>
