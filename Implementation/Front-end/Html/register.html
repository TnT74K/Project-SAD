<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام در رزرو سنتر</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0B2545;
            --primary-mid: #1B4F72;
            --primary-light: #2E86C1;
            --accent: #D4AC0D;
            --bg: #eef2f7;
            --bg-card: #ffffff;
            --text: #1a2a3a;
            --text-2: #4a6080;
            --text-3: #8aa0b8;
            --border: rgba(11, 37, 69, 0.1);
            --radius: 14px;
            --radius-sm: 8px;
            --shadow: 0 2px 16px rgba(11, 37, 69, 0.08);
            --shadow-md: 0 4px 24px rgba(11, 37, 69, 0.13);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--text);
            background:
                radial-gradient(ellipse at 20% 0%, rgba(46, 134, 193, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 100%, rgba(11, 37, 69, 0.10) 0%, transparent 50%),
                linear-gradient(160deg, #dde8f4 0%, #eef2f7 40%, #e8f0f8 100%);
            background-attachment: fixed;
        }

        input,
        button,
        textarea,
        select {
            font-family: 'Vazirmatn', sans-serif;
        }

        .auth-card {
            width: 420px;
            max-width: 100%;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 36px 28px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .logo-sub {
            font-size: 0.95rem;
            color: var(--text-2);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-2);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            height: 46px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background-color: var(--bg-card);
            color: var(--text);
            font-size: 0.95rem;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
            transition: border-color .2s, box-shadow .2s;
        }

        .input-group input.has-icon {
            padding-left: 44px;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(46, 134, 193, 0.2);
        }

        .toggle-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
            font-size: 18px;
            color: var(--text-3);
            line-height: 1;
        }

        .btn-primary {
            width: 100%;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--primary-light);
            color: #fff;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s ease;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: var(--primary-mid);
        }

        .btn-primary:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(46, 134, 193, 0.25);
        }

        .login-link {
            margin-top: 22px;
            font-size: 0.92rem;
            color: var(--text-2);
        }

        .login-link a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            color: var(--primary-mid);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 28px 18px;
            }

            .logo-text {
                font-size: 1.55rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo-block">
            <div class="logo-text">رزرو سنتر</div>
            <div class="logo-sub">ایجاد حساب کاربری جدید</div>
        </div>

        <form>
            <div class="form-group">
                <label for="name">نام و نام خانوادگی</label>
                <div class="input-group">
                    <input type="text" id="name" name="name" required placeholder="نام و نام خانوادگی خود را وارد کنید">
                </div>
            </div>

            <div class="form-group">
                <label for="username">نام کاربری</label>
                <div class="input-group">
                    <input type="text" id="username" name="username" required placeholder="نام کاربری خود را وارد کنید">
                </div>
            </div>

            <div class="form-group">
                <label for="national_id">کد ملی</label>
                <div class="input-group">
                    <input type="text" id="national_id" name="national_id" inputmode="numeric" maxlength="10" required placeholder="کد ملی ۱۰ رقمی خود را وارد کنید">
                </div>
            </div>

            <div class="form-group">
                <label for="password">رمز عبور</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" required placeholder="رمز عبور خود را وارد کنید" class="has-icon">
                    <span class="toggle-icon" onclick="togglePasswordVisibility('password', this)">👁</span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">تکرار رمز عبور</label>
                <div class="input-group">
                    <input type="password" id="confirm-password" name="confirm-password" required placeholder="رمز عبور را دوباره وارد کنید" class="has-icon">
                    <span class="toggle-icon" onclick="togglePasswordVisibility('confirm-password', this)">👁</span>
                </div>
            </div>

            <button type="submit" class="btn-primary">ثبت‌نام</button>
        </form>

        <div class="login-link">
            قبلاً حساب کاربری ساخته‌اید؟ <a href="login.html">وارد شوید</a>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);

            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🙈';
            } else {
                input.type = 'password';
                icon.textContent = '👁';
            }
        }
    </script>
</body>
</html>
