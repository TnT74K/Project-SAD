<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<!-- تنظیم encoding و ریسپانسیو -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مدیریت کارمندان</title>

<!-- فونت Vazirmatn -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<!-- اتصال فایل CSS -->
<link rel="stylesheet" href="../Css/SuperAdminUserList.css">

</head>

<body>

<!-- کانتینر اصلی صفحه -->
<div class="container">

<!-- کارت اصلی -->
<div class="card">

<!-- عنوان صفحه -->
<div class="page-title">مدیریت كاربران</div>

<!-- نوار ابزار -->
<div class="toolbar">

<!-- بخش جستجو -->
<div class="search-box">

<input id="searchInput" placeholder="جستجو...">

<button class="btn-primary" onclick="searchUser()">جستجو</button>

<button class="btn-warning" onclick="showAllUsers()">نمایش همه</button>

</div>

</div>

<!-- جدول کاربران -->
<table>

<thead>
<tr>
<th>نام</th>
<th>نام خانوادگی</th>
<th>نقش</th>
<th>وضعیت</th>
<th>عملیات</th>
</tr>
</thead>

<!-- این بخش توسط JS پر می‌شود -->
<tbody id="userTable"></tbody>

</table>

</div>
</div>


<!-- مودال ثبت / ویرایش -->
<div class="modal" id="userModal">

<div class="modal-content">

<div class="modal-header">ثبت / ویرایش کارمند</div>

<div class="form-grid">

<input id="firstName" placeholder="نام">
<input id="lastName" placeholder="نام خانوادگی">
<input id="nationalCode" placeholder="کد ملی">
<input id="username" placeholder="نام کاربری">

<!-- رمز عبور -->
<div class="password-wrap">

<input id="password" type="password" placeholder="رمز عبور">

<button class="show-pass" onclick="togglePass()">👁</button>

</div>

<!-- انتخاب نقش -->
<select id="role">
<option>مدير</option>
<option>پشتيبان سازمان</option>
<option>كارمند حضوري</option>
<option>كاربر عادي</option>
</select>

</div>

<!-- دکمه‌های مودال -->
<div class="modal-actions">

<button class="btn-primary" onclick="saveUser()">ثبت</button>

<button onclick="closeModal()">انصراف</button>

</div>

</div>
</div>

<!-- اتصال فایل جاوااسکریپت -->
<script src="../JavaScript/SuperAdminUserList.js"></script>

</body>
</html>
