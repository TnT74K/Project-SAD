<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <!-- تنظیم encoding و ریسپانسیو -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدیریت کاربران</title>


  <!-- اتصال فایل CSS -->
  <link rel="stylesheet" href="/components/fonts.css">
  <link rel="stylesheet" href="user-list.css">

</head>

<body>

  <div id="header-placeholder"></div>

  <main>

    <div class="container">
      <div class="card">


        <!-- عنوان صفحه -->
        <div class="page-title">مدیریت كاربران</div>

        <!-- نوار ابزار -->
        <div class="toolbar">

          <!-- بخش جستجو -->
          <div class="search-box">

            <input id="searchInput" placeholder="جستجو...">

            <button class="btn-primary-staff" onclick="searchUser()">جستجو</button>

            <button class="btn-warning-staff" onclick="showAllUsers()">نمایش همه</button>

          </div>

        </div>

        <!-- جدول کاربران -->
        <table>

          <thead>
            <tr>
              <th>نام</th>
              <th>نام خانوادگی</th>
              <th>شماره موبايل</th>
              <th>وضعیت</th>
              <th>عملیات</th>
            </tr>
          </thead>

          <!-- این بخش توسط JS پر می‌شود -->
          <tbody id="userTable"></tbody>

        </table>

      </div>
    </div>

  </main>

  <div id="footer-placeholder"></div>



  <!-- مودال ویرایش -->
  <!-- مودال ویرایش -->
<div class="modal" id="userModal">
    <div class="modal-content">
        <div class="modal-header">ویرایش کاربر</div>
        <div class="form-grid">
            <input id="firstName" placeholder="نام">
            <input id="lastName" placeholder="نام خانوادگی">
            <input id="nationalCode" placeholder="کد ملی">
            <input id="username" placeholder="نام کاربری">
            <div class="password-wrap">
                <input id="password" type="password" placeholder="رمز عبور">
                <button class="show-pass" onclick="togglePass()">👁</button>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-primary-staff" onclick="saveUser()">ثبت</button>
            <button onclick="closeModal()">انصراف</button>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- مودال تایید عملیات (بیرون از مودال ویرایش) -->
<!-- ========================================== -->
<div class="modal" id="confirmModal">
    <div class="modal-content">
        <h3 id="confirmTitle">تأیید عملیات</h3>
        <p id="confirmText"></p>
        <div class="modal-actions">
            <button id="confirmBtn" onclick="confirmAction()">تأیید</button>
            <button onclick="closeConfirmModal()">انصراف</button>
        </div>
    </div>
</div>

      <!-- اتصال فایل جاوااسکریپت -->
      <script src="user-list.js"></script>
      <script src="/components/load-header.js"></script>
      <script src="/components/header.js"></script>
      <script src="/components/load-footer.js"></script>

</body>

</html>
