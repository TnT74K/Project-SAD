<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به رزرو سنتر</title>
    <link rel="stylesheet" href="../../components/fonts.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>
     <div class="auth-card">
        <div class="logo-block">
            <div class="logo-text">رزرو سنتر</div>
            <div class="logo-sub">ورود به حساب کاربری</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('password')">رمز عبور</button>
            <button class="tab-btn" onclick="switchTab('otp')">کد یکبار مصرف</button>
        </div>

        <!-- فرم رمز عبور -->
        <div id="panel-password" class="form-panel active">
            <div class="form-group">
                <label for="pw-phone">شماره تلفن</label>
                <div class="input-group phone-wrapper">
                    <span class="phone-prefix">🇮🇷 +98</span>
                    <input type="tel" id="pw-phone" maxlength="10" placeholder="9123456789" inputmode="numeric" dir="ltr">
                </div>
                <div id="pw-phone-msg" class="status-msg"></div>
            </div>

            <div class="form-group">
                <label for="pw-password">رمز عبور</label>
                <div class="input-group">
                    <input type="password" id="pw-password" class="has-icon" placeholder="رمز عبور خود را وارد کنید">
                    <span class="toggle-icon" onclick="togglePass('pw-password', this)">👁</span>
                </div>
                <div id="pw-pass-msg" class="status-msg"></div>
            </div>

            <a href="forgot-password.html" class="forgot-password">فراموشی رمز عبور؟</a>

            <button class="btn-primary" onclick="submitPassword()">
                <span class="spinner"></span>
                <span class="btn-text">ورود</span>
            </button>
        </div>

        <!-- فرم OTP -->
        <div id="panel-otp" class="form-panel">
            <div id="otp-step1" class="step active">
                <div class="step-indicator">
                    <div class="step-dot active"></div>
                    <div class="step-dot"></div>
                </div>

                <div class="form-group">
                    <label for="otp-phone">شماره تلفن</label>
                    <div class="input-group phone-wrapper">
                        <span class="phone-prefix">🇮🇷 +98</span>
                        <input type="tel" id="otp-phone" maxlength="10" placeholder="9123456789" inputmode="numeric" dir="ltr">
                    </div>
                    <div id="otp-phone-msg" class="status-msg"></div>
                </div>

                <button class="btn-primary" onclick="sendOtp()">
                    <span class="spinner"></span>
                    <span class="btn-text">ارسال کد</span>
                </button>
            </div>

            <div id="otp-step2" class="step">
                <div class="step-indicator">
                    <div class="step-dot done"></div>
                    <div class="step-dot active"></div>
                </div>

                <div class="form-group">
                    <label>کد تأیید ارسال‌شده به <span id="phone-display" style="color:var(--primary);direction:ltr;unicode-bidi:embed"></span></label>
                    <div class="otp-boxes" id="otp-boxes">
                        <input type="text" maxlength="1" inputmode="numeric" id="otp0">
                        <input type="text" maxlength="1" inputmode="numeric" id="otp1">
                        <input type="text" maxlength="1" inputmode="numeric" id="otp2">
                        <input type="text" maxlength="1" inputmode="numeric" id="otp3">
                        <input type="text" maxlength="1" inputmode="numeric" id="otp4">
                    </div>
                    <div id="otp-code-msg" class="status-msg"></div>

                    <div class="otp-meta">
                        <button class="resend-btn" id="resend-btn" onclick="resendOtp()" disabled>ارسال مجدد</button>
                        <span class="timer" id="countdown">۰۲:۰۰</span>
                    </div>
                </div>

                <button class="btn-primary" onclick="verifyOtp()">
                    <span class="spinner"></span>
                    <span class="btn-text">تأیید و ورود</span>
                </button>

                <button onclick="backToStep1()" style="background:none;border:none;color:var(--text-3);font-size:0.85rem;cursor:pointer;margin-top:12px;width:100%;">
                    ← تغییر شماره تلفن
                </button>
            </div>
        </div>

        <div class="signup-link">
            حساب کاربری ندارید؟ <a href="sign-up.html">ثبت‌نام کنید</a>
        </div>
    </div>

        <!-- مودال انتخاب نقش -->
    <div id="role-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-icon-wrap">
                <span style="font-size:28px;">👤</span>
            </div>

            <div class="modal-title">انتخاب نقش و سازمان</div>

            <div class="modal-sub">
                لطفاً نقش و سازمان مورد نظر خود را برای ورود انتخاب کنید
            </div>

            <!-- کارت‌ها توسط JavaScript ساخته می‌شوند -->
            <div id="role-grid" class="role-grid"></div>

            <div id="role-modal-msg" class="status-msg"></div>

            <button
                type="button"
                class="btn-primary"
                id="modal-confirm-btn"
                onclick="confirmRole()"
                disabled>
                <span class="spinner"></span>
                <span class="btn-text">ورود به سیستم</span>
            </button>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>
