<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازیابی رمز عبور</title>
    <link rel="stylesheet" href="/components/fonts.css">
    <link rel="stylesheet" href="forgot-password.css">
</head>

<body>
    <div class="auth-card">
        <div class="logo-block">
            <div class="logo-text">رزرو سنتر</div>
            <div class="logo-sub">بازیابی رمز عبور</div>
        </div>

        <!-- Step 1: Phone number -->
        <div id="step-phone" class="step active">
            <p class="step-hint">شماره موبایل خود را وارد کنید تا کد تأیید برایتان ارسال شود.</p>
            <div class="form-group">
                <label for="phone">شماره موبایل</label>
                <div class="input-group">
                    <input type="tel" id="phone" name="phone" inputmode="numeric" maxlength="11" required
                        placeholder="مثال: 09123456789" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
            </div>
            <button type="button" class="btn-primary" onclick="sendOtp()">ارسال کد تأیید</button>
        </div>

        <!-- Step 2: OTP verification -->
        <div id="step-otp" class="step">
            <p class="step-hint" id="otp-hint">کد ۶ رقمی ارسال شده به شماره <strong id="phone-display"></strong> را وارد
                کنید.</p>
            <div class="form-group">
                <label>کد تأیید</label>
                <div class="otp-inputs" id="otp-inputs">
                    <input class="otp-box" type="text" inputmode="numeric" maxlength="1">
                    <input class="otp-box" type="text" inputmode="numeric" maxlength="1">
                    <input class="otp-box" type="text" inputmode="numeric" maxlength="1">
                    <input class="otp-box" type="text" inputmode="numeric" maxlength="1">
                    <input class="otp-box" type="text" inputmode="numeric" maxlength="1">
                    <input class="otp-box" type="text" inputmode="numeric" maxlength="1">
                </div>
            </div>
            <div class="timer-row">
                <span id="timer-text">ارسال مجدد تا <span id="countdown">02:00</span></span>
                <button type="button" id="resend-btn" class="resend-btn" onclick="resendOtp()" disabled>ارسال
                    مجدد</button>
            </div>
            <button type="button" class="btn-primary" onclick="verifyOtp()">تأیید کد</button>
            <button type="button" class="btn-ghost" onclick="goToStep('phone')">تغییر شماره</button>
        </div>

        <!-- Step 3: New password -->
        <div id="step-password" class="step">
            <p class="step-hint">رمز عبور جدید خود را وارد کنید.</p>
            <div class="form-group">
                <label for="new_password">رمز عبور جدید</label>
                <div class="input-group">
                    <input type="password" id="new_password" name="new_password" required
                        placeholder="رمز عبور جدید را وارد کنید" class="has-icon">
                    <span class="toggle-icon" onclick="togglePasswordVisibility('new_password', this)">👁</span>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm_new_password">تکرار رمز عبور جدید</label>
                <div class="input-group">
                    <input type="password" id="confirm_new_password" name="confirm_new_password" required
                        placeholder="رمز عبور جدید را دوباره وارد کنید" class="has-icon">
                    <span class="toggle-icon" onclick="togglePasswordVisibility('confirm_new_password', this)">👁</span>
                </div>
            </div>
            <button type="button" class="btn-primary" onclick="submitNewPassword()">ذخیره رمز عبور</button>
        </div>

        <!-- Step 4: Success -->
        <div id="step-success" class="step">
            <div class="success-icon">✔</div>
            <p class="success-msg">رمز عبور شما با موفقیت تغییر یافت.</p>
            <a href="login.html" class="btn-primary" style="display:block;text-decoration:none;text-align:center;">ورود
                به حساب</a>
        </div>

        <!-- Progress dots -->
        <div class="progress-dots" id="progress-dots">
            <span class="dot active" data-step="0"></span>
            <span class="dot" data-step="1"></span>
            <span class="dot" data-step="2"></span>
        </div>

        <div class="back-to-login">
            به صفحه ورود بازگردید؟ <a href="login.html">ورود</a>
        </div>
    </div>

    <script src="forgot-password.js"></script>
</body>

</html>
