<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رزروسنتر — داشبورد</title>

<link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div id="header-placeholder"></div>

<main class="main">

<div class="dashboard-layout">

<!-- Sidebar -->
<aside class="profile-section">

<div class="card">
<div class="profile-card">

<div class="profile-avatar">م</div>
<div class="profile-name">مدیر سازمان</div>
<div class="profile-role">مدیريت سازمان</div>

<div class="profile-stats">
<div class="profile-stat">
<div class="val">۱٬۲۴۰</div>
<div class="lbl">کل رزرو</div>
</div>

<div class="profile-stat">
<div class="val">۹۸٪</div>
<div class="lbl">رضایت</div>
</div>

<div class="profile-stat">
<div class="val">۳۶</div>
<div class="lbl">ماه فعال</div>
</div>
</div>

</div>
</div>

<div class="card">

<div class="card-header">
<h2>تقویم شمسی</h2>
</div>

<div class="card-body">

<div class="cal-nav">
<button class="cal-nav-btn" id="calNext">&#8250;</button>
<span id="calMonthLabel">—</span>
<button class="cal-nav-btn" id="calPrev">&#8249;</button>
</div>

<div class="cal-grid" id="calGrid"></div>

</div>
</div>

</aside>



<!-- Main Dashboard -->
<section class="dashboard-section">

<div class="topbar-wrapper">
<div class="topbar">
<div class="topbar-title">
<h1>داشبورد مدیریتی</h1>
<p id="topbarDate">در حال بارگذاری...</p>
</div>
</div>
</div>



<!-- Clock -->
<div class="content-grid">

<div class="clock-widget">

<div class="clock-time" id="clockTime">--:--:--</div>

<div class="clock-dates">

<div class="clock-date-item">
شمسی: <span id="jalaliDate">—</span>
</div>

<div class="clock-date-item">
میلادی: <span id="gregorianDate">—</span>
</div>

</div>

</div>

</div>



<!-- Stats -->
<div class="stats-grid">

<div class="stat-card">
<div class="stat-icon blue">📅</div>
<div class="stat-info">
<div class="value">۱۲۴</div>
<div class="label">رزرو امروز</div>
<div class="change up">↑ ۸٪ نسبت به دیروز</div>
</div>
</div>

<div class="stat-card">
<div class="stat-icon green">✅</div>
<div class="stat-info">
<div class="value">۹۸</div>
<div class="label">تأیید شده</div>
<div class="change up">↑ ۱۲٪</div>
</div>
</div>

<div class="stat-card">
<div class="stat-icon yellow">⏳</div>
<div class="stat-info">
<div class="value">۱۸</div>
<div class="label">در انتظار</div>
<div class="change down">↓ ۳٪</div>
</div>
</div>

<div class="stat-card">
<div class="stat-icon red">❌</div>
<div class="stat-info">
<div class="value">۸</div>
<div class="label">لغو شده</div>
<div class="change down">↓ ۵٪</div>
</div>
</div>

</div>

</section>

</div>

</main>

<div id="footer-placeholder"></div>

<script src="dashboard.js" defer></script>
<script src="../../../components/temp/load-header-with-profile-for-orgadmin.js" defer></script>
<script src="../../../components/header.js" defer></script>
<script src="../../../components/temp/load-footer-for-orgadmin.js" defer></script>

</body>
</html>
